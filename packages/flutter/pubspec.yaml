name: indycheck
description: Offline Indian ID validation for Dart and Flutter — PAN, Aadhaar, GSTIN, IFSC, UPI, mobile, PIN code, TAN, CIN, LLPIN, EPIC and vehicle registration.
version: 0.2.4
homepage: https://github.com/dusmamud/indycheck
repository: https://github.com/dusmamud/indycheck
issue_tracker: https://github.com/dusmamud/indycheck/issues

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  # Used by the build hook (hook/build.dart) to download and verify the
  # prebuilt native library: archive extracts the release .tar.gz/.zip,
  # crypto checks its SHA-256 against SHA256SUMS.txt, and code_assets /
  # hooks are the Dart build-hooks API itself.
  archive: ^4.0.0
  code_assets: ^2.2.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  hooks: ^2.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
