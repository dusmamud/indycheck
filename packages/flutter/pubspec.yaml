name: indycheck
description: Offline Indian ID validation for Dart and Flutter — PAN, Aadhaar, GSTIN, IFSC, UPI, mobile, PIN code, TAN, CIN, LLPIN, Voter ID / EPIC and vehicle registration (including Bharat BH series). Format + checksum only, no network.
version: 0.2.2
homepage: https://github.com/dusmamud/indycheck
repository: https://github.com/dusmamud/indycheck
issue_tracker: https://github.com/dusmamud/indycheck/issues

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
