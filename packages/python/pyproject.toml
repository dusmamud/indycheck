[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indycheck"
version = "0.1.2"
description = "Offline Indian ID validator — mobile, PAN, Aadhaar, GSTIN, IFSC, UPI and PIN code. Format + checksum only, no network, no government database."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dusmamud" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/dusmamud/indycheck"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
