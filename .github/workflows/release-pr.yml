name: Release PR
# Release flow:
#  - On every push to main, `release-plz update` bumps the Cargo workspace
#    version from conventional commits (feat -> minor, fix -> patch,
#    chore/docs -> no bump) and updates CHANGELOG.md. The sync step keeps
#    the JS/Python packages and the docs site on the same version, and the
#    job opens (or updates) a `release-plz` PR with all of it.
#  - Merging that PR publishes indycheck to crates.io automatically
#    (the `release` job below, via Trusted Publishing) and creates the
#    GitHub release with the changelog as its body (release-plz.toml).
#  - npm and PyPI are NOT auto-published: npm needs a staged publish +
#    Dus's passkey approval, PyPI needs a pypi.yml dispatch. Those stay
#    manual on purpose.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install release-plz
        # NOTE: release-plz/action only accepts `release-pr` or `release`
        # as its `command` — `update` is silently ignored (the action runs
        # neither), which is why the first version of this workflow opened
        # no PR at all. Install the CLI directly and run `update` ourselves.
        # Pinned to 0.4.3: 0.4.2 has a changelog-template regression
        # ("Template parse error ... stack limit reached" on `# Changelog`)
        # that breaks `release-plz update`; 0.4.3 (and 0.3.153) work.
        # Do NOT go back to `@latest` without re-running `update` locally.
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b
        with:
          tool: release-plz@0.4.3
      - name: Update versions and changelog
        run: release-plz update
      - name: Sync JS/Python/docs versions with the Rust workspace
        run: bash scripts/sync-versions.sh
      - name: Refresh Cargo.lock
        run: cargo check -p indycheck
      - name: Open or update the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing to release"
            exit 0
          fi
          version=$(grep -m1 '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release-plz
          git add -A
          git commit -m "chore: Release package indycheck version $version"
          git push --force-with-lease origin release-plz
          if gh pr list --head release-plz --json number --jq '.[0].number' | grep -q .; then
            echo "release PR already open, branch updated"
          else
            gh pr create --base main --head release-plz \
              --title "chore: Release package indycheck version $version" \
              --body "Release PR (release-plz). Merging publishes indycheck $version to crates.io and creates the GitHub release. npm and PyPI still need their manual steps."
          fi

  release:
    # Runs on every push to main, after the PR job. Publishes only when
    # the workspace version is new (i.e. right after a release PR merges);
    # on ordinary pushes it is a no-op.
    needs: release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Release to crates.io
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
