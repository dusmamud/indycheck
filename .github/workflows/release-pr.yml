name: Release PR
# Release flow:
#  - On every push to main, `release-plz update` bumps the Cargo workspace
#    version from conventional commits (feat -> minor, fix -> patch,
#    chore/docs -> no bump) and updates CHANGELOG.md. The sync step keeps
#    the JS/Python packages and the docs site on the same version, and the
#    job opens (or updates) a `release-plz` PR with all of it.
#  - release-plz only counts commits touching crates/indycheck, so a batch
#    of Flutter/PHP/FFI/napi/Go/CI-only commits never triggers a bump.
#    scripts/release-fallback.sh covers that case: after `release-plz
#    update` leaves no diff, it patch-bumps and writes the changelog entry
#    from git log when feat/fix/perf commits exist since the last tag.
#  - Merging that PR does NOT publish by itself. Publish with a manual
#    dispatch of the `Release` workflow (release.yml) — it is the only
#    workflow the crates.io Trusted Publishing config allows (crate
#    Settings > Trusted Publishing: workflow file release.yml). A `release`
#    job used to live in this file too, but its OIDC JWT names
#    release-pr.yml, so crates.io rejected it (400) on every merge and the
#    run went red. Do NOT re-add a release job here.
#  - npm and PyPI are NOT auto-published: npm needs a staged publish +
#    Dus's passkey approval, PyPI needs a pypi.yml dispatch. Those stay
#    manual on purpose.
on:
  push:
    branches:
      - main

# Serialize runs: two concurrent runs race on the `git push --force-with-lease`
# to the `release-plz` branch (the loser fails with "stale info"). Queuing is
# safe because each run re-reads main before updating the PR.
concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install release-plz
        # NOTE: release-plz/action only accepts `release-pr` or `release`
        # as its `command` — `update` is silently ignored (the action runs
        # neither), which is why the first version of this workflow opened
        # no PR at all. Install the CLI directly and run `update` ourselves.
        # Pinned to 0.4.3: 0.4.2 has a changelog-template regression
        # ("Template parse error ... stack limit reached" on `# Changelog`)
        # that breaks `release-plz update`; 0.4.3 (and 0.3.153) work.
        # Do NOT go back to `@latest` without re-running `update` locally.
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b
        with:
          tool: release-plz@0.4.3
      - name: Update versions and changelog
        run: release-plz update
      - name: Fallback bump for satellite-only batches
        # release-plz only counts commits touching crates/indycheck, so
        # Flutter/PHP/FFI/napi/Go/CI-only batches never open a release PR.
        # scripts/release-fallback.sh bumps the patch version and writes
        # the changelog entry from git log when release-plz produced no
        # diff but feat/fix/perf commits exist since the last tag. It is
        # a no-op in every other case — including the already-bumped
        # post-merge state, where local version != latest tag version.
        run: bash scripts/release-fallback.sh
      - name: Sync JS/Python/docs versions with the Rust workspace
        run: bash scripts/sync-versions.sh
      - name: Refresh Cargo.lock
        run: cargo check -p indycheck
      - name: Open or update the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing to release"
            exit 0
          fi
          version=$(grep -m1 '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B release-plz
          git add -A
          git commit -m "chore: Release package indycheck version $version"
          git push --force-with-lease origin release-plz
          if gh pr list --head release-plz --json number --jq '.[0].number' | grep -q .; then
            echo "release PR already open, branch updated"
          else
            gh pr create --base main --head release-plz \
              --title "chore: Release package indycheck version $version" \
              --body "Release PR (release-plz). After merging, publish indycheck $version to crates.io by manually dispatching the Release workflow (release.yml); it creates the GitHub release too. npm and PyPI still need their manual steps."
          fi
