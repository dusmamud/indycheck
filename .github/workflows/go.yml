# Go binding CI — cgo wrapper in packages/go over the Rust C API
# (crates/indycheck-ffi). Builds the C library first, then vets and tests the
# Go package against it on all three OSes. Windows needs a C toolchain for
# cgo; MinGW gcc from Chocolatey is the standard choice for go+cgo on
# windows-latest. Note the Windows build step: the MSVC-built Rust
# staticlib cannot be linked by MinGW gcc (undefined std/panic_unwind
# symbols), so on Windows the C library is built for the
# x86_64-pc-windows-gnu target and its static archive is copied where
# `-lindycheck_ffi` finds it — the Go binary then links statically.
name: Go

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/go/**'
      - 'crates/indycheck-ffi/**'
      - 'crates/indycheck/**'
      - '.github/workflows/go.yml'

jobs:
  go:
    name: Go binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      # cgo needs a C compiler on Windows. MinGW gcc via Chocolatey is the
      # usual setup for go+cgo on windows-latest; choco puts gcc on PATH
      # for subsequent steps.
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y
      - name: Build C library
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # The MSVC-built staticlib cannot be linked by MinGW gcc
            # (undefined std/panic_unwind symbols at cgo link time), so
            # build the GNU target instead and copy its static archive
            # where `-lindycheck_ffi` finds it. MinGW's ld searches
            # libindycheck_ffi.a before indycheck_ffi.lib, so the GNU
            # archive wins and the Go binary links statically (no DLL
            # needed at runtime).
            rustup target add x86_64-pc-windows-gnu
            cargo build -p indycheck-ffi --release --target x86_64-pc-windows-gnu
            cp target/x86_64-pc-windows-gnu/release/libindycheck_ffi.a target/release/
          else
            cargo build -p indycheck-ffi --release
          fi
      # Windows: the test binary loads indycheck_ffi.dll at runtime, and
      # Windows has no rpath — the DLL must be findable via PATH.
      - name: Add Rust lib dir to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ github.workspace }}\target\release" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: vet
        working-directory: packages/go
        env:
          CGO_ENABLED: '1'
        run: go vet ./...
      - name: test
        working-directory: packages/go
        env:
          CGO_ENABLED: '1'
        run: go test ./...
