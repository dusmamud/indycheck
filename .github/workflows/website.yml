name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  website:
    name: Astro Starlight build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: install
        working-directory: website
        run: npm ci
      - name: build
        working-directory: website
        run: npm run build
      - name: check pages
        working-directory: website
        run: |
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          test -f dist/playground/index.html
          test -f dist/docs/index.html
          echo "website pages OK"
