# Flutter binding CI — pure-Dart package in packages/flutter, which loads
# the Rust C library via dart:ffi (INDYCHECK_NATIVE_LIB). No Android
# emulator or iOS simulator is needed: `flutter test` on Linux exercises
# the FFI bindings directly against the freshly built .so.
#
# Jobs:
#   flutter         — the package itself: analyze + test (host-built .so).
#   example-linux   — the example app: analyze + widget tests + Linux build.
#   example-android — the example app: APK build, only when an Android SDK
#                     is present on the runner; skipped honestly otherwise.
#
# Platforms NOT built here, and why (see also the per-job summaries):
#   iOS / macOS / Windows / web — no runner for them in this workflow
#   (ubuntu-latest only) and the example app has no runner folders for
#   them. The indycheck hook does ship prebuilt archives for
#   darwin-arm64/x64, win32-x64-msvc/gnu and ios-arm64/ios-simulator in
#   the indycheck-v<version> releases, so those platforms can be built
#   from a machine running them; they are not faked as passing here.
name: Flutter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/flutter/**'
      - 'crates/indycheck-ffi/**'
      - 'crates/indycheck/**'
      - '.github/workflows/flutter.yml'

jobs:
  flutter:
    name: Flutter (dart:ffi) package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C library
        run: cargo build -p indycheck-ffi --release
      # Flutter 3.50.0 ships Dart 3.14, which the package requires
      # (sdk >=3.14.0, DynamicLibrary.codeAsset is a 3.14 API).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - name: Get dependencies
        working-directory: packages/flutter
        run: flutter pub get
      # The example app is a separate package (it has its own pubspec),
      # but `flutter analyze` in the package directory also covers it —
      # resolve its dependencies first so the analysis is real.
      - name: Get example app dependencies
        working-directory: packages/flutter/example
        run: flutter pub get
      - name: Analyze
        working-directory: packages/flutter
        run: flutter analyze
      - name: Test
        working-directory: packages/flutter
        env:
          INDYCHECK_NATIVE_LIB: ${{ github.workspace }}/target/release/libindycheck_ffi.so
        run: flutter test

  example-linux:
    name: Example app (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      - name: Check Flutter/Dart versions
        run: |
          flutter --version
          dart --version
      - name: Install Linux desktop build dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y clang cmake ninja-build pkg-config
          libgtk-3-dev liblzma-dev
      - name: Get dependencies
        working-directory: packages/flutter/example
        run: flutter pub get
      - name: Analyze example app
        working-directory: packages/flutter/example
        run: flutter analyze
      # Widget tests exercise the real FFI calls: the package's build
      # hook downloads the prebuilt linux-x64-gnu libindycheck_ffi from
      # the indycheck-v<version> GitHub release for this build.
      - name: Test example app
        working-directory: packages/flutter/example
        run: flutter test
      - name: Build example app (Linux)
        working-directory: packages/flutter/example
        run: flutter build linux --release
      - name: Platform coverage summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Example app — platform coverage (Linux job)
          - Linux: `flutter analyze`, `flutter test` (widget tests, real FFI calls) and `flutter build linux --release` all ran on ubuntu-latest.
          - Android: see the `example-android` job.
          - iOS / macOS / Windows / web: NOT built in CI — no runner for those platforms in this workflow (ubuntu-latest only), and the example app has no ios/macos/windows/web runner folders. Not faked as passing.
          EOF

  example-android:
    name: Example app (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
      # The APK build needs a JDK 17+ (Gradle 9.5 / AGP 9.3.1) and the
      # Android SDK. GitHub-hosted ubuntu runners ship an Android SDK,
      # but this step checks for it instead of assuming it, so a runner
      # without one skips the build honestly instead of failing obscurely.
      - name: Check for Android SDK
        id: android-sdk
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android SDK found at $ANDROID_HOME"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android SDK found at $ANDROID_SDK_ROOT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Android SDK on this runner — skipping the APK build."
          fi
      - name: Set up JDK 17
        if: steps.android-sdk.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        if: steps.android-sdk.outputs.available == 'true'
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # API 36 platform + build-tools + the NDK Flutter 3.50 expects
          # (28.2.13676358); the ubuntu image does not guarantee them.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358"
      - name: Get dependencies
        if: steps.android-sdk.outputs.available == 'true'
        working-directory: packages/flutter/example
        run: flutter pub get
      # The hook downloads the prebuilt android-* libindycheck_ffi
      # archives (arm64-v8a, armeabi-v7a, x86, x86_64) from the
      # indycheck-v<version> GitHub release for this build.
      - name: Build APK
        if: steps.android-sdk.outputs.available == 'true'
        working-directory: packages/flutter/example
        run: flutter build apk
      - name: Platform coverage summary
        if: always()
        run: |
          {
            echo "## Example app — Android"
            if [ "${{ steps.android-sdk.outputs.available }}" = "true" ]; then
              echo "APK build attempted on ubuntu-latest (Android SDK present, JDK 17, API 36 + NDK 28.2.13676358 installed)."
              echo "If this job is green, the release APK built successfully. If it is red, the failure above is the reason — no result is faked."
            else
              echo "NOT built: no Android SDK was found on this runner, so \`flutter build apk\` was skipped rather than faked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
