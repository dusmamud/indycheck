name: Release

# Manual only — it never runs on push, so it can never turn CI red by itself.
# Publishes to crates.io via Trusted Publishing (GitHub OIDC): no long-lived
# CARGO_REGISTRY_TOKEN secret is needed. release-plz exchanges the OIDC
# token for a short-lived registry token itself. The trusted publisher must
# be configured once on crates.io (crate Settings > Trusted Publishing):
# GitHub repo dusmamud/indycheck, workflow file release.yml, no environment.
# Keep the API token out of this workflow — do not re-add CARGO_REGISTRY_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch pubdev-release.yml after the tag is created
  id-token: write

jobs:
  release-plz:
    name: release-plz (crates.io only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Auto-publish the Flutter package to pub.dev after the crates.io release.
  # The tag created by release-plz (via GITHUB_TOKEN) does NOT trigger the
  # tag-push workflow (GitHub does not trigger workflows from GITHUB_TOKEN
  # events), so this job dispatches pubdev-release.yml explicitly with the
  # new tag as ref — the OIDC token then carries refs/tags/indycheck-vX.Y.Z,
  # which matches the pub.dev tag pattern indycheck-v{{version}}.
  # workflow_dispatch events triggered by GITHUB_TOKEN DO create runs
  # (the documented exception to the non-trigger rule).
  publish-pubdev:
    name: publish to pub.dev (dispatch)
    needs: release-plz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch pub.dev publish for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="indycheck-v$VERSION"
          echo "release tag: $TAG"
          git fetch --tags origin
          git rev-parse "$TAG^{commit}" >/dev/null || { echo "tag $TAG not found (release-plz did not create it?)" >&2; exit 1; }
          gh workflow run pubdev-release.yml --ref "$TAG" -f tag="$TAG"
          echo "dispatched pubdev-release.yml for $TAG"

  # Auto-publish the Kotlin/Android library to Maven Central after the
  # crates.io release. Same GITHUB_TOKEN caveat as the pub.dev job above:
  # the release-plz tag does not trigger the tag-push workflow, so dispatch
  # kotlin-release.yml explicitly with the new tag as ref. The publish job
  # inside kotlin-release.yml fails fast if the 4 secrets are missing
  # (MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD / GPG_PRIVATE_KEY /
  # GPG_PASSPHRASE) — see packages/kotlin/README.md.
  publish-kotlin:
    name: publish to Maven Central (dispatch)
    needs: release-plz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch Maven Central publish for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="indycheck-v$VERSION"
          echo "release tag: $TAG"
          git fetch --tags origin
          git rev-parse "$TAG^{commit}" >/dev/null || { echo "tag $TAG not found (release-plz did not create it?)" >&2; exit 1; }
          gh workflow run kotlin-release.yml --ref "$TAG" -f tag="$TAG"
          echo "dispatched kotlin-release.yml for $TAG"
