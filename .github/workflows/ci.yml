name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: CLI smoke test
        run: |
          cargo run -q -p indycheck -- validate pan ABCDE1234F
          cargo run -q -p indycheck -- validate gstin 18ABCDE1234F1ZZ
          cargo run -q -p indycheck -- generate aadhaar

  js:
    name: TypeScript wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      # NOTE: `npm install`, not `npm ci`. The 5 indycheck-napi-<platform>
      # optionalDependencies do not exist on npm yet (first publish is
      # 0.2.5 via napi-release.yml), so no lock file can carry resolved
      # entries for them and `npm ci` (npm 11) fails the sync check
      # ("Missing: indycheck-napi-* from lock file"). `npm install`
      # warns about the missing optional deps and continues; the tests
      # run against the TypeScript mirror (native tests skipped).
      # After the 0.2.5 napi publish, regenerate package-lock.json
      # (it can then resolve the platform packages) and switch back
      # to `npm ci`.
      - name: install
        working-directory: packages/js
        run: npm install
      - name: build + typecheck
        working-directory: packages/js
        run: |
          npm run build
          npm run typecheck
      - name: test
        working-directory: packages/js
        run: npm test

  python:
    name: Python wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest packages/python/tests -q
