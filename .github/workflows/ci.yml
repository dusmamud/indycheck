name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: CLI smoke test
        run: |
          cargo run -q -p indycheck -- validate pan ABCDE1234F
          cargo run -q -p indycheck -- validate gstin 18ABCDE1234F1ZZ
          cargo run -q -p indycheck -- generate aadhaar

  js:
    name: TypeScript wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - name: install
        working-directory: packages/js
        run: npm ci
      - name: build + typecheck
        working-directory: packages/js
        run: |
          npm run build
          npm run typecheck
      - name: test
        working-directory: packages/js
        run: npm test

  python:
    name: Python wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: test
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest packages/python/tests -q
