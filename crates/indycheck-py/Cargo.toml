[package]
name = "indycheck-py"
version.workspace = true
# Binding crate — never published to crates.io on its own; only the
# core `indycheck` crate is published. Prevents release-plz from
# trying to publish it (its path dependency has no version requirement).
publish = false
# Edition 2024 (inherited from the workspace). PyO3 0.30 is edition-2024
# clean; the old 0.22 override (unsafe-op-in-unsafe-fn warnings) is gone.
edition.workspace = true
license.workspace = true
description = "Python bindings for indycheck — thin PyO3 wrappers over the Rust core"

[lib]
name = "indycheck"
crate-type = ["cdylib"]

[dependencies]
indycheck = { path = "../indycheck" }
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
serde_json = "1"
