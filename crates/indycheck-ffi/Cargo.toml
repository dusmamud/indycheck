[package]
name = "indycheck-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
# Binding crate — never published to crates.io on its own; only the
# core `indycheck` crate is published. Prevents release-plz from
# trying to publish it.
publish = false
description = "C FFI bindings for indycheck (C API, used by the Go binding)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indycheck = { path = "../indycheck" }
serde_json = "1"
