[package]
name = "indycheck-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
# Binding crate — never published to crates.io on its own; only the
# core `indycheck` crate is published. Prevents release-plz from
# trying to publish it (its path dependency has no version requirement).
publish = false
description = "Node.js bindings for indycheck — thin napi-rs wrappers over the Rust core (Phase 2 scaffold)"

[lib]
crate-type = ["cdylib"]

[dependencies]
indycheck = { path = "../indycheck" }
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
serde_json = "1"
