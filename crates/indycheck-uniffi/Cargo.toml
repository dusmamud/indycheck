[package]
name = "indycheck-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
# Binding crate — never published to crates.io on its own; only the
# core `indycheck` crate is published. Prevents release-plz from
# trying to publish it.
publish = false
description = "UniFFI bindings for indycheck (Phase 3 scaffold, not in v0.1)"

[dependencies]
indycheck = { path = "../indycheck" }
