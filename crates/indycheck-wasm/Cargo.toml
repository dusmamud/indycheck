[package]
name = "indycheck-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
# Binding crate — never published to crates.io on its own; only the
# core `indycheck` crate is published. Prevents release-plz from
# trying to publish it (its path dependency has no version requirement).
publish = false
description = "WASM bindings for indycheck — thin wrappers over the Rust core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indycheck = { path = "../indycheck" }
serde_json = "1"
wasm-bindgen = "0.2"

# wasm-opt (binaryen) cannot be downloaded in offline/sandboxed builds;
# disabling it keeps `wasm-pack build` working without optimisation.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
