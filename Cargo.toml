[workspace]
# Binding crates (napi/uniffi/ffi) are workspace members with
# `publish = false` in their own Cargo.toml, so release-plz never tries
# to publish them — only the core `indycheck` crate is published.
members = [
    "crates/indycheck",
    "crates/indycheck-wasm",
    "crates/indycheck-py",
    "crates/indycheck-napi",
    "crates/indycheck-uniffi",
    "crates/indycheck-ffi",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dusmamud/indycheck"
homepage = "https://github.com/dusmamud/indycheck"
authors = ["dusmamud"]
